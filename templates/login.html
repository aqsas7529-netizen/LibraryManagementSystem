<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Library Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #edf2f7;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .title {
            font-size: 25px;
            color: #17365d;
            margin-bottom: 25px;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

            input:focus {
                outline: none;
                border-color: #17365d;
            }

        button {
            width: 100%;
            padding: 12px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

            button:hover {
                background: #24558b;
            }

        .error {
            color: #c62828;
            margin-bottom: 15px;
        }

        .register-link {
            margin-top: 20px;
            font-size: 14px;
        }

            .register-link a {
                color: #17365d;
                font-weight: bold;
                text-decoration: none;
            }

                .register-link a:hover {
                    text-decoration: underline;
                }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }

            .title {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">

            <h1 class="title">📚 Library Management System</h1>
            <h2>Login</h2>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Enter username"
                       required>

                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter password"
                       required>

                <button type="submit">Login</button>
            </form>

            <p class="register-link">
                Don't have an account?
                <a href="/register">Register here</a>
            </p>

        </div>
    </div>
</body>
</html>
